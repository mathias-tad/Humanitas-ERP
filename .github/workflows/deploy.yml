name: CI & Deployment Pipeline (Humanitas-ERP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Backend Testing Suite
  # =========================================================================
  test-backend:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: humanitas_backend/tenant-backend/main_rest_apis/package-lock.json

      - name: Install Backend Dependencies
        working-directory: humanitas_backend/tenant-backend/main_rest_apis
        run: npm ci --legacy-peer-deps

      - name: Run Backend Unit & Integration Tests
        working-directory: humanitas_backend/tenant-backend/main_rest_apis
        run: npm test -- --ci --coverage=false
      - name: Install Admin Backend Dependencies
        working-directory: humanitas_backend/admin-backend
        run: npm ci --legacy-peer-deps
      - name: Run Admin Backend Tests
        working-directory: humanitas_backend/admin-backend
        run: npm test -- --ci

  # =========================================================================
  # 2. Frontend Build & Typecheck Suite
  # =========================================================================
  test-frontend:
    name: Frontend Build & Typecheck Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: humanitas_frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: humanitas_frontend
        run: npm ci

      - name: Build & Typecheck Frontend
        working-directory: humanitas_frontend
        run: npm run build

      - name: Frontend Unit Tests
        working-directory: humanitas_frontend
        run: npm test
      - name: Install Admin Frontend Dependencies
        working-directory: tenant-admin_frontend
        run: npm ci
      - name: Build & Typecheck Admin Frontend
        working-directory: tenant-admin_frontend
        run: npm run build
      - name: Admin Frontend Unit Tests
        working-directory: tenant-admin_frontend
        run: npm test

  # =========================================================================
  # 2b. Calculation Service (payroll, tax, leave) Testing Suite
  # =========================================================================
  test-calculation:
    name: Calculation Service (Python) Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: humanitas_backend/tenant-backend/calculation_service/requirements.txt

      - name: Install Calculation Service Dependencies
        working-directory: humanitas_backend/tenant-backend/calculation_service
        run: pip install -r requirements.txt

      - name: Run Calculation Service Unit Tests
        working-directory: humanitas_backend/tenant-backend/calculation_service
        run: python -m unittest discover -s tests -v

  # =========================================================================
  # 3b. Rules & feature-list consistency (AGENTS.md rules 14 and 25)
  # =========================================================================
  test-docs:
    name: Rules & Feature List Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Progress table matches the checkboxes
        run: python3 scripts/update_features_progress.py --check featureslist.md
      - name: CLAUDE.md and .cursorrules match AGENTS.md
        run: python3 scripts/sync_agent_rules.py --check

  # =========================================================================
  # 3. Mobile Testing Suite (non-blocking)
  # =========================================================================
  test-mobile:
    name: Mobile (Flutter) Tests & Quality Gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: humanitas-ERP_mobile
        run: flutter pub get

      - name: Run Mobile Widget & Unit Tests
        working-directory: humanitas-ERP_mobile
        run: flutter test

  # =========================================================================
  # 4. Deployment (GATED: Only runs if backend + frontend tests pass)
  # =========================================================================
  deploy:
    name: Deploy to Production VPS
    needs: [test-backend, test-frontend, test-calculation, test-docs]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Merging several PRs in a row starts several runs. Two deploys recreating the same
    # containers at once fail with 'No such container' / 'name already in use', so
    # deploys wait for each other (a newer pending run replaces an older pending one).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting Humanitas-ERP Deployment..."
            cd /srv/Humanitas-ERP

            # Safely preserve existing VPS .env so git pull never conflicts
            if [ -f .env ]; then
              cp .env .env.backup
              git checkout -- .env 2>/dev/null || true
            fi

            git fetch origin
            BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # Restore original VPS .env
            if [ -f .env.backup ]; then
              mv .env.backup .env
            fi

            docker compose build
            # An interrupted recreate can leave a container renamed to '<12-hex-id>_<name>',
            # which makes the next 'up' fail with a name conflict. If that happens, remove
            # only such leftovers from this compose project and try once more.
            if ! docker compose up -d --remove-orphans; then
              PROJECT=$(basename "$PWD" | tr '[:upper:]' '[:lower:]')
              STALE=$(docker ps -a --filter "label=com.docker.compose.project=$PROJECT" --format '{{.ID}} {{.Names}}' | awk '$2 ~ /^[0-9a-f]{12}_/ {print $1}')
              if [ -n "$STALE" ]; then
                echo "Removing stale containers left by an interrupted deploy: $STALE"
                docker rm -f $STALE
              fi
              docker compose up -d --remove-orphans
            fi
            docker compose ps
            docker image prune -f
            echo "✅ Humanitas-ERP Deployed Successfully!"
