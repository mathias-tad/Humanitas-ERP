name: CI & Deployment Pipeline (Humanitas-ERP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Backend Testing Suite
  # =========================================================================
  test-backend:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: humanitas_backend/tenant-backend/main_rest_apis/package-lock.json

      - name: Install Backend Dependencies
        working-directory: humanitas_backend/tenant-backend/main_rest_apis
        run: npm ci --legacy-peer-deps

      - name: Run Backend Unit & Integration Tests
        working-directory: humanitas_backend/tenant-backend/main_rest_apis
        run: npm test -- --ci --coverage=false

  # =========================================================================
  # 2. Frontend Build & Typecheck Suite
  # =========================================================================
  test-frontend:
    name: Frontend Build & Typecheck Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: humanitas_frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: humanitas_frontend
        run: npm ci

      - name: Build & Typecheck Frontend
        working-directory: humanitas_frontend
        run: npm run build

  # =========================================================================
  # 3. Mobile Testing Suite
  # =========================================================================
  test-mobile:
    name: Mobile (Flutter) Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        working-directory: humanitas-ERP_mobile
        run: flutter pub get

      - name: Run Mobile Widget & Unit Tests
        working-directory: humanitas-ERP_mobile
        run: flutter test

  # =========================================================================
  # 4. Deployment (GATED: Only runs if ALL test suites succeed on push to main/master)
  # =========================================================================
  deploy:
    name: Deploy to Production VPS
    needs: [test-backend, test-frontend, test-mobile]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting Humanitas-ERP Deployment..."

            # 1. Initialize directory and clone if not present
            if [ ! -d "/srv/Humanitas-ERP" ]; then
              echo "📁 /srv/Humanitas-ERP not found. Cloning..."
              mkdir -p /srv/Humanitas-ERP
              git clone https://github.com/mathias-tad/Humanitas-ERP.git /srv/Humanitas-ERP
            fi

            cd /srv/Humanitas-ERP

            # 2. Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout main || git checkout master
            git pull origin main || git pull origin master

            # 3. Ensure .env.production exists (if not present or contains CHANGE_ME, replace with template)
            if [ ! -f "/srv/Humanitas-ERP/.env.production" ] || grep -q "CHANGE_ME" /srv/Humanitas-ERP/.env.production 2>/dev/null; then
              echo "📝 Refreshing .env.production with production database settings..."
              cp /srv/Humanitas-ERP/.env.production.example /srv/Humanitas-ERP/.env.production
            fi

            # Copy to .env so docker compose can read it
            cp /srv/Humanitas-ERP/.env.production /srv/Humanitas-ERP/.env

            # 4. Build and start containers with force-recreate
            echo "🐳 Building and starting containers..."
            docker compose --env-file .env.production build
            docker compose --env-file .env.production up -d --force-recreate --remove-orphans

            # 5. Wait for admin-api to be ready
            echo "🔄 Waiting for erp-admin-api to be ready..."
            for i in $(seq 1 20); do
              if docker compose exec -T admin-api wget -q --spider http://localhost:3000/api/v1/health > /dev/null 2>&1 || \
                 docker compose exec -T admin-api wget -q --spider http://localhost:3000/api/v1/docs > /dev/null 2>&1; then
                echo "✅ erp-admin-api is ready."
                break
              fi
              echo "   Waiting for erp-admin-api... ($i/20)"
              sleep 3
            done

            # 6. Auto-seed admin user
            echo "🌱 Running admin database seeder..."
            docker compose exec -T admin-api wget -qO- --post-data="" http://localhost:3000/api/v1/users/admins/seed 2>/dev/null || \
            curl -s -X POST http://127.0.0.1:5001/api/v1/users/admins/seed || true

            docker image prune -f
            echo "================================================="
            echo "🎉 Humanitas-ERP Deployment Completed Successfully!"
            echo "================================================="
