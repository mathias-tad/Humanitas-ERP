server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded files (product pictures, profile photos, attachments) are stored by the API. They are served
    # under this site's own address, so a picture opened in a new tab shows our domain, not the API's.
    # Docker's DNS (127.0.0.11) lets nginx start even if the API container is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ^~ stops the image-cache rule below from catching /uploads/*.jpg before it reaches the API.
    location ^~ /uploads/ {
        set $tenant_api http://tenant-api:3001;
        proxy_pass $tenant_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # Older links (/api/uploads/...) from the Vercel set-up.
    location ~ ^/api/uploads/(.*)$ {
        proxy_pass http://tenant-api:3001/uploads/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support for Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires max;
        add_header Pragma public;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }
}
