services:
  # -------------------------------------------------------------------------
  # Service 1: Admin Backend (Port 3000)
  # -------------------------------------------------------------------------
  admin-api:
    build: ./humanitas_backend/admin-backend
    container_name: admin-api
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # External Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - API_PREFIX=api/v1
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-token-secret}
      - JWT_REFRESH_EXPIRES_IN=30d
      - COOKIE_SECRET=${COOKIE_SECRET:-My-cookie-secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - THROTTLE_LIMIT=100
      - THROTTLE_TTL=60
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:1300}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
    volumes:
      - ./uploads:/app/uploads

  # -------------------------------------------------------------------------
  # Service 2: Tenant API (Port 3001) - NO Cron
  # -------------------------------------------------------------------------
  tenant-api:
    build: ./humanitas_backend/tenant-backend/main_rest_apis
    container_name: tenant-api
    restart: always
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_CRON=false
      # External Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - ADMIN_BACKEND_URL=${ADMIN_BACKEND_URL:-http://admin-api:3000/api/v1}
      - API_PREFIX=api/v1
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:1300}
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET:-my-supper-secrete-key}
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-my-secret-key}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CALCULATION_SERVICE_URL=http://python-api:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:1300}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - MESSAGE_ENCRYPTION_KEY=${MESSAGE_ENCRYPTION_KEY}
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 3: Tenant Worker (Port 3002) - YES Cron
  # -------------------------------------------------------------------------
  tenant-worker:
    build: ./humanitas_backend/tenant-backend/main_rest_apis
    container_name: tenant-worker
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ENABLE_CRON=true
      # External Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - ADMIN_BACKEND_URL=${ADMIN_BACKEND_URL:-http://admin-api:3000/api/v1}
      - API_PREFIX=api/v1
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:1300}
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET:-my-supper-secrete-key}
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-my-secret-key}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CALCULATION_SERVICE_URL=http://python-api:8000
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - MESSAGE_ENCRYPTION_KEY=${MESSAGE_ENCRYPTION_KEY}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 4: Python Calculation API (FastAPI - Port 8000)
  # -------------------------------------------------------------------------
  python-api:
    build: ./humanitas_backend/tenant-backend/calculation_service
    container_name: python-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # External Database Configuration
      - ADMIN_DATABASE_URL=${DATABASE_URL}
      - DEBUG=false
    command: python run.py

  # -------------------------------------------------------------------------
  # Service 5: Python Calculation Worker (Background Jobs)
  # -------------------------------------------------------------------------
  python-worker:
    build: ./humanitas_backend/tenant-backend/calculation_service
    container_name: python-worker
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # External Database Configuration
      - ADMIN_DATABASE_URL=${DATABASE_URL}
      - DEBUG=false
    depends_on:
      - python-api
    command: python -m app.worker_main

  # -------------------------------------------------------------------------
  # Service 6: Admin Frontend (React - Port 5173)
  # -------------------------------------------------------------------------
  admin-frontend:
    build:
      context: ./tenant-admin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_API_URL:-http://localhost:3000/api/v1}
    container_name: admin-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 7: Tenant Frontend (React - Port 1300)
  # -------------------------------------------------------------------------
  tenant-frontend:
    build:
      context: ./humanitas_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${TENANT_API_URL:-http://localhost:3001/api/v1}
        VITE_SOCKET_URL: ${SOCKET_URL:-http://localhost:3001}
    container_name: tenant-frontend
    restart: always
    ports:
      - "1300:80"
    depends_on:
      - tenant-api

  # -------------------------------------------------------------------------
  # Service 8: Nginx Reverse Proxy (Gateway)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: humanitas-nginx
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-api
      - tenant-api
      - admin-frontend
      - tenant-frontend
