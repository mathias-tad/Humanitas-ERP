services:
  # -------------------------------------------------------------------------
  # Service 1: Admin Backend (NestJS)
  # -------------------------------------------------------------------------
  admin-api:
    build: ./humanitas_backend/admin-backend
    container_name: erp-admin-api
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:5001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - API_PREFIX=api/v1
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=30d
      - COOKIE_SECRET=${COOKIE_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - THROTTLE_LIMIT=100
      - THROTTLE_TTL=60
      - CORS_ORIGINS=${CORS_ORIGINS:-https://humanitas-erp.ziontech.tech,https://admin.humanitas-erp.ziontech.tech,https://api.humanitas-erp.ziontech.tech,https://api-admin.humanitas-erp.ziontech.tech,http://localhost:5173,http://localhost:1300}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
    volumes:
      - ./uploads:/app/uploads

  # -------------------------------------------------------------------------
  # Service 2: Tenant API (NestJS)
  # -------------------------------------------------------------------------
  tenant-api:
    build: ./humanitas_backend/tenant-backend/main_rest_apis
    container_name: erp-tenant-api
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:5002:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_CRON=false
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - ADMIN_BACKEND_URL=${ADMIN_BACKEND_URL:-http://admin-api:3000/api/v1}
      - API_PREFIX=api/v1
      - FRONTEND_URL=${FRONTEND_URL}
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CALCULATION_SERVICE_URL=http://python-api:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-https://humanitas-erp.ziontech.tech,https://admin.humanitas-erp.ziontech.tech,https://api.humanitas-erp.ziontech.tech,https://api-admin.humanitas-erp.ziontech.tech,http://localhost:1300}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - MESSAGE_ENCRYPTION_KEY=${MESSAGE_ENCRYPTION_KEY}
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 3: Tenant Worker (NestJS cron)
  # -------------------------------------------------------------------------
  tenant-worker:
    build: ./humanitas_backend/tenant-backend/main_rest_apis
    container_name: erp-tenant-worker
    restart: always
    stop_grace_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ENABLE_CRON=true
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=false
      - ADMIN_BACKEND_URL=${ADMIN_BACKEND_URL:-http://admin-api:3000/api/v1}
      - API_PREFIX=api/v1
      - FRONTEND_URL=${FRONTEND_URL}
      - BCRYPT_SALT_ROUNDS=12
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CALCULATION_SERVICE_URL=http://python-api:8000
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - MESSAGE_ENCRYPTION_KEY=${MESSAGE_ENCRYPTION_KEY}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 4: Python Calculation API
  # -------------------------------------------------------------------------
  python-api:
    build: ./humanitas_backend/tenant-backend/calculation_service
    container_name: erp-python-api
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:5003:8000"
    environment:
      - ADMIN_DATABASE_URL=${DATABASE_URL}
      - DEBUG=false
    command: python run.py

  # -------------------------------------------------------------------------
  # Service 5: Python Calculation Worker
  # -------------------------------------------------------------------------
  python-worker:
    build: ./humanitas_backend/tenant-backend/calculation_service
    container_name: erp-python-worker
    restart: always
    stop_grace_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ADMIN_DATABASE_URL=${DATABASE_URL}
      - DEBUG=false
    depends_on:
      - python-api
    command: python -m app.worker_main

  # -------------------------------------------------------------------------
  # Service 6: Admin Frontend (React Vite)
  # -------------------------------------------------------------------------
  admin-frontend:
    build:
      context: ./tenant-admin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_API_URL:-https://api-admin.humanitas-erp.ziontech.tech/api/v1}
    container_name: erp-admin-frontend
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:5010:80"
    depends_on:
      - admin-api

  # -------------------------------------------------------------------------
  # Service 7: Tenant Frontend (React Vite)
  # -------------------------------------------------------------------------
  tenant-frontend:
    build:
      context: ./humanitas_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${TENANT_API_URL:-https://api.humanitas-erp.ziontech.tech/api/v1}
        VITE_SOCKET_URL: ${SOCKET_URL:-https://api.humanitas-erp.ziontech.tech}
    container_name: erp-tenant-frontend
    restart: always
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:5011:80"
    depends_on:
      - tenant-api
