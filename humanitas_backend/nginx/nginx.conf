events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver (allows nginx to resolve container names)
    resolver 127.0.0.11 valid=30s;
    
    # Tenant Frontend (Port 80)
    server {
        listen 80;
        server_name _;

        location / {
            # Use variable to force DNS resolution at runtime
            set $tenant_frontend tenant-frontend;
            proxy_pass http://$tenant_frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin Frontend (Port 8080)
    server {
        listen 8080;
        server_name _;

        location / {
            # Use variable to force DNS resolution at runtime
            set $admin_frontend admin-frontend;
            proxy_pass http://$admin_frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
