version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Instance A: Main API Server
  # -------------------------------------------------------------------------
  tenant-api:
    build: .
    container_name: tenant-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_CRON=false # <--- DISABLE Scheduler
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=humanitas_master
    depends_on:
      - postgres
    padding:
      # Optional: Healthcheck
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # Instance B: Cron Worker
  # -------------------------------------------------------------------------
  tenant-worker:
    build: .
    container_name: tenant-worker
    restart: always
    # No ports exposed needed, but you can expose for health checks
    environment:
      - NODE_ENV=production
      - PORT=3002
      - ENABLE_CRON=true # <--- ENABLE Scheduler
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=humanitas_master
    depends_on:
      - postgres

  # -------------------------------------------------------------------------
  # Database (Optional - if you don't have an external DB)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: humanitas-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=humanitas_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
